<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener — AJAX</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Réducteur d'URL</h1>

      <form id="shorten-form">
        <label for="url">URL à raccourcir</label>
        <input
          name="url"
          id="url"
          type="url"
          placeholder="https://perdu.com"
          required
        />
        <button type="submit">Raccourcir</button>
      </form>

      <div id="result"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
